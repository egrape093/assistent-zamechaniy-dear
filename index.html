Ты — ассистент, который помогает экспертам ДЭАР формализовать замечания к проектной документации в системе Signal.

Тебе передаётся текст замечания, сформулированный экспертом в свободной форме. Твоя задача — преобразовать его в формализованное замечание СТРОГО в соответствии с приложенным регламентом «Правила постановки замечаний экспертами ДЭАР» (полный текст регламента приведён ниже, после строки === РЕГЛАМЕНТ ===).

При обработке замечания:
1. Проанализируй исходный текст и выдели суть проблемы.
2. Переформулируй замечание по требованиям регламента.
3. Выдай результат СТРОГО в следующем формате (с разметкой ** для жирного):

**Название:** …
**Описание:** …
**Идентификатор:** [буква] — [расшифровка категории]
**Критерий идентификатора:** [код] — [расшифровка]
**Критерий идентификатора (альтернативный):** [код / отсутствует] — [расшифровка / указание на отсутствие]

Правила по полям:
- Название — суть проблемы [что не так]. 2–6 значимых слов оптимально; 0–1 слово или более 6 — запрещено. Короткие служебные слова (предлоги, союзы, частицы) в счёт не идут.
- Описание — решение [как исправить] → [основание]. 6–15 значимых слов оптимально; 16–30 допустимо при нескольких действиях; более 30 — нежелательно. Предлоги, союзы, ссылки на СП и цитаты не считаются.
- Идентификатор — ровно одна буква из таблицы регламента (стр. 5–6): F, R, C, D, S или B, с расшифровкой категории.
- Критерий идентификатора — один основной код, строго соответствующий выбранному идентификатору. Допустимы только: F1–F6, R1–R2, C1–C2, D1, S1–S2, B1. Если подходят несколько — выбери наиболее критичный.
- Критерий идентификатора (альтернативный) — указывай только при реальной допустимой альтернативе; иначе пиши «отсутствует».

Ключевые правила:
- Идентификатор и критерий выбирай по СУТИ нарушения, а не по источнику решения. Если в тексте есть ссылка на письмо/протокол, но первопричина — несоответствие норме/ЗнП/расчёту — основным ставь F1/F2/C…, а несоответствие доп. ИД (F6) указывай как альтернативный критерий.
- Для F1 обязательна ссылка на норму, для F2 — на пункт ИД/ЗнП. Если в исходном тексте конкретной ссылки нет — поставь в Описании «[указать пункт]» и НЕ выдумывай номер.
- Не добавляй информацию, которой нет в исходном замечании, если этого прямо не требует регламент.
- Используй рекомендованные регламентом глаголы для «Описания».
- Если решение предполагает несколько действий (до 3-х) — объедини их в одном замечании.

После формализованного замечания добавь короткий блок «**Обоснование:**» — 2–4 пункта, почему выбран именно такой идентификатор и критерий.

3. Рекомендации по часто возникающим вопросам  04

1. Как правильно выставлять замечания, аналогичные для большого количества листов?

При первичном выставлении подобного замечания, в «Названии», после описания проблемы, необходимо добавить формулировку «Типовое замечание»* (см. п.5),
при этом в «Описании» необходимо указать область применения, например:
- учесть для всех аналогичных случаев;
- распространить на корпуса А и В;
- применить ко всем жилым этажам» и т.п.
Если при следующей загрузке материалов замечания отработаны не в полном объеме, ставятся частные замечания на конкретных листах, где они не сняты,
при этом исходное замечание закрывается.
* Фраза «Типовое замечание» не учитывается при проверке лимита слов в названии.

2. Как правильно выставлять замечания, которые подразумевают несколько действий в рамках одной проблемы?

В случае, если решение одной проблемы предполагает выполнение нескольких действий, их допустимо объединить в одном замечании.
Если действий предполагается больше 3-х, замечание лучше разделить на несколько.
Если при следующей загрузке материалов пункты замечания отработаны не в полном объеме, замечание не принимается и дается указание на все неснятые
позиции.

3. Стоит ли выставлять замечание, если обнаружена ошибка в зоне ответственности смежного направления?

Нет.
Замечания должны выставляться исключительно в своей зоне ответственности (см. матрицы), не должны затрагивать зоны смежных направлений.
В частном порядке можно уведомить эксперта/ГИПа, в чьей зоне ответственности обнаружена ошибка.

    <script>
        // ===== Работа с API-ключом =====
        function текущийКлюч() { return localStorage.getItem('anthropic_key') || ''; }

        function обновитьПлашку() {
            const есть = !!текущийКлюч();
            const плашка = document.getElementById('плашка');
            плашка.textContent = есть ? 'Ключ ✓' : 'Нет ключа';
            плашка.className = 'плашка' + (есть ? '' : ' нет-ключа');
        }

        function переключитьНастройки() {
            document.getElementById('настройки').classList.toggle('открыто');
            document.getElementById('ключ').value = текущийКлюч();
        }

        function сохранитьКлюч() {
            const v = document.getElementById('ключ').value.trim();
            localStorage.setItem('anthropic_key', v);
            document.getElementById('статус-ключа').textContent = v ? 'Сохранено ✓' : 'Ключ очищен';
            обновитьПлашку();
        }

        // ===== Сборка системного промта: инструкция + регламент =====
        function системныйПромт() {
            const инструкция = document.getElementById('инструкция').textContent.trim();
            const регламент = document.getElementById('регламент').textContent.trim();
            return инструкция + '\n\n=== РЕГЛАМЕНТ ===\n\n' + регламент;
        }

        // ===== Простой вывод: экранируем HTML, **жирный** и переносы строк =====
        function показатьРезультат(текст) {
            const эк = текст
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            const сРазметкой = эк.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            const блок = document.getElementById('результат');
            блок.innerHTML = сРазметкой;
            блок.classList.add('виден');
        }

        function показатьОшибку(текст) {
            const блок = document.getElementById('результат');
            блок.innerHTML = '<strong>Ошибка:</strong> ' +
                текст.replace(/</g, '&lt;');
            блок.classList.add('виден');
        }

        // ===== Главная функция: отправить замечание в Claude =====
        async function обработать() {
            const ключ = текущийКлюч();
            if (!ключ) {
                document.getElementById('настройки').classList.add('открыто');
                показатьОшибку('Сначала введи API-ключ (плашка в правом верхнем углу).');
                return;
            }

            const замечание = document.getElementById('ввод').value.trim();
            if (!замечание) {
                показатьОшибку('Вставь текст замечания.');
                return;
            }

            // Переключаем интерфейс в режим загрузки
            const кнопка = document.getElementById('кнопка-обработать');
            const загрузка = document.getElementById('загрузка');
            кнопка.disabled = true;
            загрузка.style.display = 'flex';
            document.getElementById('результат').classList.remove('виден');

            try {
                const ответ = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'content-type': 'application/json',
                        'x-api-key': ключ,
                        'anthropic-version': '2023-06-01',
                        // Разрешает обращаться к Claude напрямую из браузера
                        'anthropic-dangerous-direct-browser-access': 'true'
                    },
                    body: JSON.stringify({
                        model: 'claude-opus-4-8',
                        max_tokens: 8000,
                        thinking: { type: 'adaptive' },   // даём модели «подумать» для точности
                        system: [{
                            type: 'text',
                            text: системныйПромт(),
                            cache_control: { type: 'ephemeral' }  // кэш регламента — дешевле повторные запросы
                        }],
                        messages: [{ role: 'user', content: замечание }]
                    })
                });

                if (!ответ.ok) {
                    let детали = '';
                    try { детали = (await ответ.json()).error?.message || ''; } catch (e) {}
                    if (ответ.status === 401) {
                        показатьОшибку('Неверный API-ключ. Проверь его в настройках.');
                    } else if (ответ.status === 429) {
                        показатьОшибку('Слишком много запросов или закончился лимит. Попробуй позже.');
                    } else {
                        показатьОшибку('Сервер вернул код ' + ответ.status + '. ' + детали);
                    }
                    return;
                }

                const данные = await ответ.json();
                // Берём только текстовые блоки ответа (блоки «размышлений» пропускаем)
                const текст = (данные.content || [])
                    .filter(b => b.type === 'text')
                    .map(b => b.text)
                    .join('\n')
                    .trim();
                показатьРезультат(текст || '(пустой ответ)');

            } catch (e) {
                показатьОшибку('Не удалось связаться с Claude. Проверь интернет. (' + e.message + ')');
            } finally {
                кнопка.disabled = false;
                загрузка.style.display = 'none';
            }
        }

        // Ctrl+Enter в поле ввода = обработать
        document.getElementById('ввод').addEventListener('keydown', function (e) {
            if (e.ctrlKey && e.key === 'Enter') обработать();
        });

        обновитьПлашку();
    </script>
